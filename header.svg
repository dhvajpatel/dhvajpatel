<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#0F2A3F"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#06B6D4" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <style>
      .name { font: 800 72px 'Segoe UI', Arial, sans-serif; fill: url(#txt); animation: fade 1.4s ease-out both; }
      .sub  { font: 600 20px 'Courier New', monospace; fill: #A5F3FC; letter-spacing: 1px; animation: fade 2s ease-out both; }
      .tag  { font: 500 15px 'Courier New', monospace; fill: #67E8F9; opacity: .85; animation: fade 2.6s ease-out both; }
      @keyframes fade { from { opacity: 0; transform: translateY(14px);} to { opacity: 1; transform: translateY(0);} }
    </style>
  </defs>
  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#grid)"/>
  <circle cx="860" cy="60" r="90" fill="#06B6D4" fill-opacity="0.15">
    <animate attributeName="cy" values="60;90;60" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="210" r="70" fill="#2563EB" fill-opacity="0.18">
    <animate attributeName="cx" values="140;190;140" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="230" r="40" fill="#22D3EE" fill-opacity="0.15">
    <animate attributeName="r" values="40;55;40" dur="5s" repeatCount="indefinite"/>
  </circle>
  <rect x="0" y="0" width="1000" height="3" fill="#22D3EE" fill-opacity="0.5">
    <animate attributeName="y" values="0;260;0" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="125" text-anchor="middle" class="name">Dhvaj Patel</text>
  <text x="500" y="167" text-anchor="middle" class="sub">AI &amp; DATA SCIENCE  •  FULL-STACK BUILDER</text>
  <text x="500" y="200" text-anchor="middle" class="tag">&lt; ship fast, ship pretty /&gt;</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
