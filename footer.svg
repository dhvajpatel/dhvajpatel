<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="50%" stop-color="#0F2A3F"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="90" fill="url(#bg)"/>
  <circle cx="120" cy="45" r="40" fill="#22D3EE" fill-opacity="0.15">
    <animate attributeName="r" values="40;55;40" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="52" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#A5F3FC">Thanks for stopping by  •  Let's build something crazy 🚀</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
